[project]
name = "gemma3-finetunning"
version = "0.1.0"
description = "ai engineer learning examples"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=1.0.10",
    "pydantic-ai-slim[huggingface]>=1.0.10",
    "pydantic-settings>=2.9.1",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "datasets>=4.1.1",
    "huggingface-hub>=0.35.0",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "mlx>=0.31.1",
    "mlx-lm>=0.31.1",
    "pytest>=8.0.0",
]
